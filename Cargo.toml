[package]
name = "flight-engineer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
mavlink = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
tokio-tungstenite = "0.26.1"
clap = {version = "4.5.24", features = ["derive"]}
